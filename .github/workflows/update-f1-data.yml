name: Update F1 title data

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh title data from Jolpica-F1
        run: python scripts/update_titles.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/ferrari-titles.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ferrari-titles.json
            git commit -m "Auto-update Ferrari title data from Jolpica-F1"
            git push
          else
            echo "No changes to title data."
          fi
